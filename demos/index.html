<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unpainting demos</title>
<style>
:root{color-scheme:light;--paper:#f6f3eb;--ink:#302c26;--muted:#71695e;--line:#ddd6c8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:40px 24px 64px}header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:32px}h1{font:400 30px/1.2 Georgia,serif;margin:0}header a{color:var(--muted);font-size:14px}.demos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.demo{color:inherit;text-decoration:none}.demo img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#fffdf8;border:1px solid var(--line)}h2{margin:14px 0 4px;font:400 24px/1.2 Georgia,serif}.demo p{margin:0;color:var(--muted);font-size:14px}.demo:hover h2{text-decoration:underline;text-underline-offset:4px}.demo:focus-visible{outline:2px solid #8f533b;outline-offset:8px}@media(max-width:720px){main{padding:28px 20px}.demos{grid-template-columns:1fr;gap:32px}.demo img{max-height:320px}h1{font-size:26px}}
</style>
</head>
<body><main>
<header><h1>Unpainting <small>0.5</small></h1><a href="https://github.com/sabj/unpainting">GitHub</a></header>
<div class="demos">
<a class="demo" href="lab/"><img src="thumbs/lab.webp" width="640" height="480" alt="The Laundresses painted with the section brush"><h2>Paint Lab</h2><p>Paint on paper. Replay a painting.</p></a>
<a class="demo" href="fungi/"><img src="thumbs/fungi.webp" width="640" height="480" alt="An ink and watercolor mushroom study"><h2>Spore Studies</h2><p>Turn, morph, and paint a specimen.</p></a>
<a class="demo" href="layers/"><img src="thumbs/layers.webp" width="640" height="480" alt="Yale Rosewalk separated into its saved painting stages"><h2>Layers</h2><p>Explore painting stages and named forms.</p></a>
</div>
</main></body></html>
