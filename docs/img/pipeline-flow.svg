<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img" aria-label="Unpainting 0.5.1 architecture: Target picture through studies and drawing into dual Auto 0.5 and Model L1-L4 tracks, across the Target-Read Guard into the shared WebGPU watercolour engine and blind open2 judging">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#584f42"/>
    </marker>
    <marker id="arr-auto" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#4f7c8a"/>
    </marker>
    <marker id="arr-model" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#99543a"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="959" height="391" rx="6" fill="#f6f2ea" stroke="#d6cebf"/>

  <!-- Header -->
  <text x="24" y="31" font-family="Georgia, serif" font-size="18.5" font-weight="600" fill="#2b2a27">Unpainting 0.5.1 — Architecture Flow</text>
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11.5" fill="#584f42">
    <line x1="652" y1="26" x2="678" y2="26" stroke="#4f7c8a" stroke-width="2.2"/>
    <text x="684" y="30">Auto 0.5 track</text>
    <line x1="788" y1="26" x2="814" y2="26" stroke="#99543a" stroke-width="2.2" stroke-dasharray="5,3"/>
    <text x="820" y="30">Model L1–L4 track</text>
  </g>

  <!-- Guard dashed boundary (vertical) -->
  <line x1="576" y1="68" x2="576" y2="286" stroke="#52693e" stroke-width="1.8" stroke-dasharray="5,4"/>
  <rect x="522" y="47" width="108" height="20" rx="3" fill="#e8efe3" stroke="#6f8759"/>
  <text x="576" y="60.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" font-weight="700" fill="#3f542e">TARGET GUARD</text>
  <text x="576" y="302" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="10.4" fill="#52693e">target pixels sealed once painting starts</text>

  <!-- 00: Target Picture -->
  <g transform="translate(24, 146)">
    <rect width="98" height="72" rx="4" fill="#fbf8f2" stroke="#c8beac"/>
    <text x="49" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#2b2a27">Target</text>
    <text x="49" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#2b2a27">picture</text>
    <text x="49" y="63" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#6d6559">watercolour</text>
  </g>

  <!-- Arrow: Target -> 01 -->
  <line x1="122" y1="182" x2="146" y2="182" stroke="#584f42" stroke-width="1.8" marker-end="url(#arr-ink)"/>

  <!-- 01: Studies & Drawing -->
  <g transform="translate(148, 126)">
    <rect width="164" height="112" rx="4" fill="#fbf8f2" stroke="#d6cebf"/>
    <rect width="164" height="4" rx="2" fill="#6d6559"/>
    <text x="12" y="23" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#6d6559">01 · PREPARE</text>
    <text x="12" y="42" font-family="Georgia, serif" font-size="14.2" font-weight="600" fill="#2b2a27">Studies &amp; Drawing</text>
    <text x="12" y="62" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.2" fill="#584f42">• 3 colour block-in studies</text>
    <text x="12" y="78" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.2" fill="#584f42">• Line drawing (Qwen)</text>
    <text x="12" y="94" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.2" fill="#584f42">• Named forms (SAM)</text>
  </g>

  <!-- Branch arrows: 01 -> 02 (Auto, solid blue) & 01 -> 03 (Model, dashed rust) -->
  <path d="M 312 156 L 340 156 L 340 116 L 370 116" fill="none" stroke="#4f7c8a" stroke-width="2" marker-end="url(#arr-auto)"/>
  <text x="340" y="106" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="10.2" fill="#4f7c8a">all inputs</text>

  <path d="M 312 208 L 340 208 L 340 238 L 370 238" fill="none" stroke="#99543a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-model)"/>
  <text x="336" y="254" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="10.2" fill="#99543a">L1–L4 + tips</text>

  <!-- 02: Auto 0.5 (blue) -->
  <g transform="translate(372, 78)">
    <rect width="172" height="80" rx="4" fill="#edf4f6" stroke="#6896a4"/>
    <rect width="172" height="4" rx="2" fill="#4f7c8a"/>
    <text x="12" y="23" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#4f7c8a">02 · AUTO 0.5</text>
    <text x="12" y="42" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#203b44">Code planner</text>
    <text x="12" y="60" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.2" fill="#2f525d">Traces contours; orders</text>
    <text x="12" y="73" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.2" fill="#2f525d">washes light → dark</text>
  </g>

  <!-- 03: Model L1-L4 (rust) -->
  <g transform="translate(372, 194)">
    <rect width="172" height="84" rx="4" fill="#f7ede8" stroke="#c07e66"/>
    <rect width="172" height="4" rx="2" fill="#99543a"/>
    <text x="12" y="23" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#99543a">03 · MODEL (L1–L4)</text>
    <text x="12" y="42" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#2d1f1b">LLM painter</text>
    <text x="12" y="60" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.2" fill="#584f42">Writes its own JSON</text>
    <text x="12" y="73" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.2" fill="#584f42">script from bare paper</text>
  </g>

  <!-- Arrows crossing Guard -> WebGPU Engine (with paper halo pills behind text so guard line never collides) -->
  <path d="M 544 118 L 604 118 L 604 154 L 620 154" fill="none" stroke="#4f7c8a" stroke-width="2" marker-end="url(#arr-auto)"/>
  <rect x="582" y="100" width="34" height="14" rx="2" fill="#f6f2ea"/>
  <text x="599" y="110.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.8" fill="#4f7c8a">plan</text>

  <path d="M 544 222 L 604 222 L 604 198 L 620 198" fill="none" stroke="#99543a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-model)"/>
  <rect x="556" y="205" width="44" height="14" rx="2" fill="#f6f2ea"/>
  <text x="578" y="215.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.8" fill="#99543a">script</text>

  <!-- Feedback arrow: Engine -> Model (half-size test looks) -->
  <path d="M 622 232 L 598 232 L 598 256 L 546 256" fill="none" stroke="#99543a" stroke-width="1.6" stroke-dasharray="3,3" marker-end="url(#arr-model)"/>
  <rect x="551" y="261" width="52" height="14" rx="2" fill="#f6f2ea"/>
  <text x="577" y="271.5" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="9.8" fill="#99543a">test looks</text>

  <!-- Shared WebGPU Paper Engine -->
  <g transform="translate(622, 120)">
    <rect width="144" height="128" rx="4" fill="#fbf8f2" stroke="#99543a" stroke-width="1.4"/>
    <rect width="144" height="4" rx="2" fill="#2b2a27"/>
    <text x="12" y="23" font-family="ui-monospace, monospace" font-size="10.2" font-weight="700" fill="#2b2a27">SHARED ENGINE</text>
    <text x="12" y="42" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#2b2a27">WebGPU Paper</text>
    <text x="12" y="62" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.2" fill="#584f42">• Cold-press relief</text>
    <text x="12" y="78" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.2" fill="#584f42">• Same brush &amp; pen</text>
    <text x="12" y="94" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.2" fill="#584f42">• Real water &amp; drying</text>
    <text x="12" y="110" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.2" fill="#584f42">• Kubelka–Munk glazes</text>
  </g>

  <!-- Arrow: Engine -> 04 Judges (generous 48px gap) -->
  <line x1="766" y1="184" x2="812" y2="184" stroke="#584f42" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <text x="789" y="166" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="9.8" fill="#584f42">sheet +</text>
  <text x="789" y="177" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="9.8" fill="#584f42">10 stills</text>

  <!-- 04: Blind Judging (open2) -->
  <g transform="translate(814, 120)">
    <rect width="122" height="128" rx="4" fill="#fbf8f2" stroke="#d6cebf"/>
    <rect width="122" height="4" rx="2" fill="#99543a"/>
    <text x="11" y="23" font-family="ui-monospace, monospace" font-size="10.2" font-weight="700" fill="#99543a">04 · OPEN2</text>
    <text x="11" y="42" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#2b2a27">Blind Judges</text>
    <text x="11" y="62" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#584f42">• Craft Q</text>
    <text x="11" y="77" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="10.4" fill="#6d6559">  blind A/B vs Auto</text>
    <text x="11" y="96" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#584f42">• Human-ness H</text>
    <text x="11" y="111" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="10.4" fill="#6d6559">  10 replay stills</text>
  </g>

  <!-- Arrow: Judges -> Score Banner -->
  <line x1="875" y1="248" x2="875" y2="316" stroke="#584f42" stroke-width="1.6" marker-end="url(#arr-ink)"/>

  <!-- Bottom Banner: Score formula strictly separated from API cost -->
  <g transform="translate(24, 320)">
    <rect width="912" height="50" rx="4" fill="#fbf8f2" stroke="#d6cebf"/>
    <text x="16" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#99543a">Combined = Q × min(1, H / 65)</text>
    <text x="16" y="39" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#584f42">Qwen 3.8 27B + Gemma 4 31B (open2) · Q indexed to original (% of original) or raw 0–100</text>
    <line x1="594" y1="8" x2="594" y2="42" stroke="#d6cebf" stroke-width="1.2"/>
    <text x="610" y="22" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.8" font-weight="600" fill="#2b2a27">Reported beside the score (never inside it)</text>
    <text x="610" y="39" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#6d6559">Model API cost ($) · Likeness (1–5) · Cheat-risk audit</text>
  </g>
</svg>
