    <text x="16" y="49" font-family="Georgia, serif" font-size="14.5" font-weight="600" fill="#2b2a27">Adjusted Δ = Model Score − Subject Mean</text>
    <text x="16" y="70" font-family="-apple-system, sans-serif" font-size="12" fill="#584f42">Raw scores pick whichever picture happened to be easiest (Cézanne,</text>
    <text x="16" y="86" font-family="-apple-system, sans-serif" font-size="12" fill="#584f42">White Ships). Subtracting the all-run subject mean spotlights real skill:</text>

    <!-- Worked examples -->
