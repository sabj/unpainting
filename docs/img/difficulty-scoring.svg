    <text x="26" y="120" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#6d6559">STANDOUT DIFFICULTY-ADJUSTED WINS (ALL 15 · OPEN2)</text>
    <text x="26" y="142" font-family="-apple-system, sans-serif" font-size="11.8" fill="#2b2a27"><tspan font-weight="600">Astra 6.2 L4 · Manet Fan</tspan> — 68.5% on a 43.5% subject</text>
