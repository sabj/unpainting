<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="How Unpainting 0.5.1 judges paintings with open2: Craft Q vs Auto, 10-frame Human-ness gate, and target-read honesty guard">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#99543a"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="6" fill="#f6f2ea" stroke="#d6cebf"/>
  <text x="28" y="34" font-family="Georgia, serif" font-size="19" font-weight="600" fill="#2b2a27">How 0.5.1 Judges a Painting (open2)</text>
  <text x="28" y="54" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6d6559">Two open-weight vision judges (Qwen 3.8 27B + Gemma 4 31B, local MLX = cloud) score craft and process separately — never feeding back into painting.</text>

  <!-- Panel 1: Craft Q (Versus-Auto A/B) -->
  <g transform="translate(28, 72)">
    <rect width="292" height="270" rx="4" fill="#fbf8f2" stroke="#d6cebf"/>
    <rect width="292" height="4" fill="#99543a"/>
    <text x="16" y="28" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#99543a">01 · CRAFT SCORE (Q)</text>
    <text x="16" y="48" font-family="Georgia, serif" font-size="15.5" font-weight="600" fill="#2b2a27">Blind Versus-Auto A/B</text>

    <!-- Round 1 -->
    <rect x="16" y="64" width="260" height="58" rx="4" fill="#f6f2ea" stroke="#d6cebf"/>
    <text x="26" y="81" font-family="ui-monospace, monospace" font-size="10.5" fill="#6d6559">PASS 1 · ORDER A / B</text>
    <rect x="26" y="89" width="70" height="24" rx="3" fill="#efe9de" stroke="#c8beac"/>
    <text x="61" y="105" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#2b2a27">Target</text>
    <rect x="104" y="89" width="76" height="24" rx="3" fill="#f3e8e1" stroke="#99543a"/>
    <text x="142" y="105" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#99543a">A: Model</text>
    <rect x="188" y="89" width="78" height="24" rx="3" fill="#e7eff2" stroke="#6896a4"/>
    <text x="227" y="105" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#203b44">B: Auto 0.5</text>

    <!-- Round 2 swapped -->
    <rect x="16" y="132" width="260" height="58" rx="4" fill="#f6f2ea" stroke="#d6cebf"/>
    <text x="26" y="149" font-family="ui-monospace, monospace" font-size="10.5" fill="#6d6559">PASS 2 · SWAPPED B / A</text>
    <rect x="26" y="157" width="70" height="24" rx="3" fill="#efe9de" stroke="#c8beac"/>
    <text x="61" y="173" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#2b2a27">Target</text>
    <rect x="104" y="157" width="76" height="24" rx="3" fill="#e7eff2" stroke="#6896a4"/>
    <text x="142" y="173" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#203b44">A: Auto 0.5</text>
    <rect x="188" y="157" width="78" height="24" rx="3" fill="#f3e8e1" stroke="#99543a"/>
    <text x="227" y="173" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#99543a">B: Model</text>

    <text x="16" y="212" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.8" fill="#584f42">• Swapping cancels position bias.</text>
    <text x="16" y="230" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.8" fill="#584f42">• Anchors against real Auto 0.5</text>
    <text x="24" y="246" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.8" fill="#584f42">instead of an inflated 9/10 target.</text>
    <text x="16" y="262" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.8" fill="#584f42">• Likeness (L) reported separately.</text>
  </g>

  <!-- Panel 2: Human-ness H & <65% Gate -->
  <g transform="translate(334, 72)">
    <rect width="318" height="270" rx="4" fill="#fbf8f2" stroke="#d6cebf"/>
    <rect width="318" height="4" fill="#6896a4"/>
    <text x="16" y="28" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#4f7c8a">02 · HUMAN-NESS GATE (H)</text>
    <text x="16" y="48" font-family="Georgia, serif" font-size="15.5" font-weight="600" fill="#2b2a27">10-Frame Process Check</text>

    <!-- 10-frame strip illustration -->
    <g transform="translate(16, 62)">
      <rect x="0" y="0" width="24" height="18" rx="2" fill="#fcfaf5" stroke="#c8beac"/>
      <rect x="29" y="0" width="24" height="18" rx="2" fill="#f7f2e7" stroke="#c8beac"/>
      <rect x="58" y="0" width="24" height="18" rx="2" fill="#efe4cf" stroke="#c8beac"/>
      <rect x="87" y="0" width="24" height="18" rx="2" fill="#e6d4b5" stroke="#c8beac"/>
      <rect x="116" y="0" width="24" height="18" rx="2" fill="#dbc29a" stroke="#c8beac"/>
      <rect x="145" y="0" width="24" height="18" rx="2" fill="#cdb084" stroke="#c8beac"/>
      <rect x="174" y="0" width="24" height="18" rx="2" fill="#bd9d72" stroke="#c8beac"/>
      <rect x="203" y="0" width="24" height="18" rx="2" fill="#ab895f" stroke="#c8beac"/>
      <rect x="232" y="0" width="24" height="18" rx="2" fill="#98754e" stroke="#c8beac"/>
      <rect x="261" y="0" width="24" height="18" rx="2" fill="#825f3c" stroke="#99543a"/>
      <text x="0" y="31" font-family="ui-monospace, monospace" font-size="9.5" fill="#6d6559">bare paper</text>
      <text x="142" y="31" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#6d6559">broad washes → glazes</text>
      <text x="285" y="31" text-anchor="end" font-family="ui-monospace, monospace" font-size="9.5" fill="#6d6559">accents</text>
    </g>

    <!-- Gate curve plot -->
    <g transform="translate(46, 112)">
      <!-- Axes -->
      <line x1="0" y1="95" x2="245" y2="95" stroke="#8a8174" stroke-width="1.2"/>
      <line x1="0" y1="8" x2="0" y2="95" stroke="#8a8174" stroke-width="1.2"/>
      <!-- Shaded penalty zone (0..65%) -->
      <rect x="1" y="10" width="159" height="84" fill="#f3e8e1" opacity="0.65"/>
      <!-- Shaded pass zone (65..100%) -->
      <rect x="160" y="10" width="85" height="84" fill="#e5efe5" opacity="0.55"/>
      <!-- Vertical threshold line at H=65% -->
      <line x1="160" y1="8" x2="160" y2="95" stroke="#99543a" stroke-width="1.5" stroke-dasharray="4,3"/>
      <!-- Curve: (0,95) -> (160,18) -> (245,18) -->
      <polyline points="0,95 160,18 245,18" fill="none" stroke="#99543a" stroke-width="3"/>
      <circle cx="160" cy="18" r="4.5" fill="#99543a"/>
      <!-- Labels -->
      <text x="-6" y="21" text-anchor="end" font-family="ui-monospace, monospace" font-size="9.5" fill="#584f42">1.0×</text>
      <text x="-6" y="96" text-anchor="end" font-family="ui-monospace, monospace" font-size="9.5" fill="#584f42">0×</text>
      <text x="0" y="109" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#584f42">0%</text>
      <text x="160" y="109" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#99543a">65%</text>
      <text x="242" y="109" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#584f42">100%</text>
      <text x="64" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#99543a">Scaled down</text>
      <text x="64" y="44" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#7d442e">× (H / 65)</text>
      <text x="202" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#3b633c">Full Q</text>
      <text x="202" y="56" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#3b633c">× 1.0</text>
    </g>
    <text x="16" y="244" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#584f42">Catches L4 Python loops &amp; scanline rasterizing</text>
    <text x="16" y="260" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#584f42">even when the final still looks acceptable.</text>
  </g>

  <!-- Panel 3: Honesty & Mechanical Checks -->
  <g transform="translate(666, 72)">
    <rect width="266" height="270" rx="4" fill="#fbf8f2" stroke="#d6cebf"/>
    <rect width="266" height="4" fill="#6f8759"/>
    <text x="16" y="28" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#52693e">03 · GUARD &amp; GATES</text>
    <text x="16" y="48" font-family="Georgia, serif" font-size="15.5" font-weight="600" fill="#2b2a27">Anti-Cheat Enforcement</text>

    <g transform="translate(16, 66)">
      <rect width="234" height="54" rx="4" fill="#f6f2ea" stroke="#d6cebf"/>
      <text x="10" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#2b2a27">Target-Read Guard</text>
      <text x="10" y="36" font-family="-apple-system, sans-serif" font-size="11" fill="#584f42">Seals target &amp; maps on paint start.</text>
      <text x="10" y="49" font-family="ui-monospace, monospace" font-size="10" fill="#52693e">target-guard.json → 0 pixel reads</text>

      <rect y="64" width="234" height="54" rx="4" fill="#f6f2ea" stroke="#d6cebf"/>
      <text x="10" y="84" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#2b2a27">Stroke-Size Gate</text>
      <text x="10" y="100" font-family="-apple-system, sans-serif" font-size="11" fill="#584f42">Bans filling broad areas with tiny dabs</text>
      <text x="10" y="113" font-family="ui-monospace, monospace" font-size="10" fill="#52693e">≤ 30% area under 1×3 mm dabs</text>

      <rect y="128" width="234" height="54" rx="4" fill="#f6f2ea" stroke="#d6cebf"/>
      <text x="10" y="148" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#2b2a27">Stage Order Check</text>
      <text x="10" y="164" font-family="-apple-system, sans-serif" font-size="11" fill="#584f42">Flags early speckle, front-loaded</text>
      <text x="10" y="177" font-family="-apple-system, sans-serif" font-size="11" fill="#584f42">darks (&gt;70% at ¼), or timid washes.</text>
    </g>
  </g>

  <!-- Bottom Combined Formula Banner -->
  <g transform="translate(28, 358)">
    <rect width="904" height="60" rx="4" fill="#efe9de" stroke="#d6cebf"/>
    <text x="20" y="26" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#99543a">HEADLINE FORMULA (0.5.1)</text>
    <text x="20" y="47" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#2b2a27">Combined = Q × min(1, H / 65)</text>
    <text x="370" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#2b2a27">Reproducible locally &amp; in cloud</text>
    <text x="370" y="45" font-family="-apple-system, sans-serif" font-size="11.8" fill="#584f42">r = 0.931 vs 3-judge archival panel · 0 faults across 330 runs · never feeds back</text>
  </g>
</svg>