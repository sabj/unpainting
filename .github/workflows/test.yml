name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: npm ci --no-audit --no-fund
      - name: Node tests
        run: npm test
      - name: Benchmark records and generated results
        run: npm run bench:test
      - name: Stroke-plan example
        run: npm run example:plan
