# Builds the demos site (tools/lab/build-site.mjs reads demos/) and deploys it to GitHub Pages.
# Runs on push to main when demos/ or the site build changes, and by hand.
# Needs Settings > Pages > Build and deployment > Source set to "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'demos/**'
      - 'tools/lab/build-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: node tools/lab/build-site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
